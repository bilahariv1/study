<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salesforce Questionnaire Review</title>
<style>
  :root{
    --bg1:#5b21b6;
    --bg2:#2563eb;
    --bg3:#7c3aed;
    --card:#ffffff;
    --text:#172033;
    --muted:#667085;
    --line:#e9eaf3;
    --accent:#6d28d9;
    --accent2:#2563eb;
    --good1:#16a34a;
    --good2:#22c55e;
    --bad1:#ef4444;
    --bad2:#f97316;
    --warn1:#f59e0b;
    --warn2:#fbbf24;
    --shadow:0 12px 35px rgba(14,25,55,.16);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.18), transparent 30%),
      radial-gradient(circle at 80% 10%, rgba(255,255,255,.14), transparent 30%),
      linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    min-height:100vh;
    overflow-x:hidden;
  }
  .shell{
    max-width:1320px;
    margin:0 auto;
    padding:150px 18px 40px;
  }
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:1000;
    backdrop-filter:blur(14px);
    background:rgba(22,26,55,.58);
    border-bottom:1px solid rgba(255,255,255,.14);
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    transition:transform .25s ease, opacity .2s ease;
  }
  .topbar.collapsed{
    transform:translateY(-120%);
    opacity:0;
    pointer-events:none;
  }
  .topbar-inner{
    max-width:1320px;
    margin:0 auto;
    padding:14px 18px 12px;
  }
  .topbar-toggle{
    position:fixed;
    top:12px;
    right:12px;
    z-index:1100;
    display:none;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(17,24,39,.72);
    color:#fff;
    padding:10px 12px;
    font-size:12px;
    font-weight:800;
    letter-spacing:.3px;
    border-radius:12px;
    box-shadow:0 10px 18px rgba(15,23,42,.2);
  }
  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:12px; color:#fff; text-decoration:none;
  }
  .brand-icon{
    width:42px;height:42px;border-radius:14px;
    background:linear-gradient(135deg,#a78bfa,#60a5fa);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 10px 20px rgba(0,0,0,.18);
    display:grid;place-items:center;font-weight:800;
  }
  .brand h1{
    margin:0;font-size:18px;font-weight:800;letter-spacing:.2px;
  }
  .brand p{
    margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.78)
  }
  .actions{
    display:flex;gap:10px;flex-wrap:wrap;
  }
  button{
    border:0;
    border-radius:14px;
    padding:11px 16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
  }
  .btn-primary{
    background:linear-gradient(135deg,#8b5cf6,#3b82f6);
    color:#fff;
    box-shadow:0 8px 20px rgba(59,130,246,.25);
  }
  .btn-secondary{
    background:rgba(255,255,255,.12);
    color:#fff;
    border:1px solid rgba(255,255,255,.14);
  }
  button:hover{transform:translateY(-1px)}
  .stats-wrap{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:10px;
    margin-top:12px;
  }
  .stat{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    border-radius:16px;
    padding:10px 12px;
  }
  .stat .label{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.7px}
  .stat .value{font-size:18px;font-weight:800;margin-top:4px}
  .progress{
    margin-top:12px;
    height:12px;border-radius:999px;
    background:rgba(255,255,255,.14);
    overflow:hidden;
    border:1px solid rgba(255,255,255,.12);
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#c4b5fd,#93c5fd,#ffffff);
    border-radius:999px;
    transition:width .3s ease;
  }
  .nav-dots,
  .summary,
  .card,
  .question-card{
    background:rgba(255,255,255,.96);
    border:1px solid rgba(255,255,255,.7);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .nav-dots{
    padding:16px;
    margin-bottom:18px;
    animation:fadeUp .4s ease both;
  }
  .summary{
    padding:18px;
    margin-bottom:18px;
    display:none;
    animation:fadeUp .45s ease both;
  }
  .summary.show{display:block}
  .summary-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:12px;
  }
  .summary-item{
    background:linear-gradient(180deg,#ffffff,#f8f9ff);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
  }
  .summary-item .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .summary-item .v{font-size:24px;font-weight:800;margin-top:6px}
  .nav-dots{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(36px,1fr));
    gap:8px;
  }
  .dot{
    border:none;
    height:36px;
    border-radius:12px;
    background:#f3f4fb;
    color:#475467;
    font-weight:800;
    cursor:pointer;
    transition:.2s ease;
    border:1px solid #e5e7f2;
    text-decoration:none;
    display:flex;align-items:center;justify-content:center;
  }
  .dot:hover{background:#ede9fe;color:#5b21b6}
  .dot.answered{
    background:linear-gradient(135deg,#ddd6fe,#bfdbfe);
    color:#312e81;
    border-color:#c4b5fd;
  }
  .dot.current{
    outline:3px solid rgba(109,40,217,.18);
    transform:translateY(-1px);
  }
  .dot.correct{
    background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(16,185,129,.2));
    color:#166534;border-color:rgba(22,163,74,.25);
  }
  .dot.incorrect,
  .dot.flagged{
    background:linear-gradient(135deg,rgba(248,113,113,.18),rgba(251,146,60,.18));
    color:#991b1b;border-color:rgba(239,68,68,.24);
  }
  .questions{
    display:grid;
    gap:16px;
  }
  .card{
    padding:18px;
    animation:fadeUp .45s ease both;
    scroll-margin-top:180px;
  }
  .card-head{
    display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;
    margin-bottom:14px;
  }
  .badges{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px;
  }
  .badge.qn{background:linear-gradient(135deg,#ede9fe,#dbeafe);color:#4c1d95}
  .badge.type{background:#f3f4fb;color:#475467;border:1px solid #e5e7f2}
  .badge.sel{background:#f3f4fb;color:#475467;border:1px solid #e5e7f2}
  .question-text{
    font-size:18px;line-height:1.45;font-weight:800;
    margin:4px 0 6px;
    white-space:pre-line;
  }
  .options{display:grid;gap:10px}
  .option {
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:14px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#fff,#fafbff);
    border-radius:18px;
    padding:14px 16px;
    cursor:pointer;
    transition:.2s ease;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
    min-height:64px;
    word-break:break-word;
    overflow-wrap:anywhere;
    text-align:left;
  }
  .option:hover{
    transform:translateY(-1px);
    border-color:#d8d6fe;
    box-shadow:0 10px 22px rgba(76,29,149,.08);
  }
  .option input{
    position:absolute;opacity:0;pointer-events:none;
  }
  .option.selected,
  .option.selected .option-text,
  .option.selected .mark,
  .option.selected .letter{
    transition:all .2s ease;
  }
  .letter{
    width:34px;height:34px;flex:0 0 34px;
    border-radius:12px;
    display:grid;place-items:center;
    background:#eef2ff;
    color:#4338ca;
    font-weight:900;
    border:1px solid #dbe1ff;
  }
  .mark{
    width:22px;height:22px;flex:0 0 22px;margin-top:5px;
    border-radius:999px;border:2px solid #c8cde0;background:#fff;position:relative;
    transition:.2s ease;
  }
  .option.selected .mark{
    border-color:#6d28d9;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    box-shadow:0 0 0 4px rgba(109,40,217,.12);
  }
  .option.selected .mark::after{
    content:"";
    position:absolute; inset:4px;
    background:#fff;border-radius:999px;
  }
  .option-text{
    flex:1;line-height:1.5;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-align:left;
  }
  .option.correct {
    background:linear-gradient(135deg,rgba(22,163,74,.14),rgba(34,197,94,.2));
    border-color:rgba(22,163,74,.35);
  }
  .option.correct .letter{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .option.correct .mark{border-color:#16a34a}
  .option.incorrect {
    background:linear-gradient(135deg,rgba(239,68,68,.14),rgba(249,115,22,.18));
    border-color:rgba(239,68,68,.35);
  }
  .option.incorrect .letter{background:#fee2e2;color:#991b1b;border-color:#fecaca}
  .option.missed {
    background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(251,191,36,.14));
    border:2px dashed rgba(245,158,11,.6);
  }
  .option.locked { cursor: default; }
  .locked .option { cursor: default; }
  .locked .option:hover { transform:none; border-color:var(--line); box-shadow: none; }
  .question-card.flagged-review{ box-shadow: 0 0 0 3px rgba(255,176,32,.28), var(--shadow); }
  .question-card.correct-card{ box-shadow:0 0 0 3px rgba(31,190,114,.16), var(--shadow); }
  .question-card.incorrect-card{ box-shadow:0 0 0 3px rgba(239,71,111,.14), var(--shadow); }
  .footer-space{height:10px}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:none}
  }
  @media (max-width:1100px){
    .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:720px){
    .topbar-toggle{display:inline-flex}
    .shell{padding-top:210px}
    body.topbar-hidden .shell{padding-top:40px}
    .brand{width:100%}
    .brand h1{font-size:16px}
    .brand p{font-size:11px}
    .actions{width:100%}
    .actions button{flex:1 1 140px}
    .nav-dots{grid-template-columns:repeat(auto-fit,minmax(38px,1fr))}
    .summary-grid{grid-template-columns:1fr}
    .question-text{font-size:16px}
    .top-row{align-items:flex-start}
    .card{padding:14px}
    .option{padding:12px 14px}
    .letter{width:30px;height:30px;flex-basis:30px}
    .mark{width:20px;height:20px}
    .option-text{font-size:15px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4}
  }
  @media (max-width:430px){
    .topbar-inner{padding-left:12px;padding-right:12px}
    .shell{padding-top:240px;padding-left:12px;padding-right:12px}
    .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stat .value{font-size:16px}
    .actions{gap:8px}
    .actions button{flex-basis:100%}
    .badge{padding:7px 10px;font-size:11px}
    .question-text{font-size:15px}
  }
</style>
</head>
<body>
  <button class="topbar-toggle" id="topbarToggle" type="button" aria-expanded="true">Hide Topbar</button>

  <div class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="top-row">
        <a href="index.html" class="brand" aria-label="Go to home page">
          <div class="brand-icon">SF</div>
          <div>
            <h1>Salesforce Questionnaire</h1>
            <p>65 questions • interactive review • one-page exam UI</p>
          </div>
        </a>
        <div class="actions">
          <button class="btn-primary" id="submitBtn">Submit</button>
          <button class="btn-secondary" id="reviewBtn">Review</button>
          <button class="btn-secondary" id="restartBtn">Restart</button>
        </div>
      </div>
      <div class="stats-wrap">
        <div class="stat"><div class="label">Answered</div><div class="value" id="answeredStat">0 / 65</div></div>
        <div class="stat"><div class="label">Selections</div><div class="value" id="selectionStat">0</div></div>
        <div class="stat"><div class="label">Correct</div><div class="value" id="correctStat">0</div></div>
        <div class="stat"><div class="label">Score</div><div class="value" id="scoreStat">0%</div></div>
        <div class="stat"><div class="label">Mode</div><div class="value" id="modeStat">Attempt</div></div>
      </div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>

  <main class="shell">
    <div class="nav-dots" id="navDots" aria-label="Question navigation"></div>

    <section class="summary" id="summaryPanel" aria-live="polite">
      <div class="summary-grid">
        <div class="summary-item"><div class="k">Total questions</div><div class="v" id="sumTotal">65</div></div>
        <div class="summary-item"><div class="k">Answered</div><div class="v" id="sumAnswered">0</div></div>
        <div class="summary-item"><div class="k">Total selections</div><div class="v" id="sumSelections">0</div></div>
        <div class="summary-item"><div class="k">Correct questions</div><div class="v" id="sumCorrectQuestions">0</div></div>
        <div class="summary-item"><div class="k">Score percentage</div><div class="v" id="sumScore">0%</div></div>
      </div>
    </section>

    <section class="questions" id="questions" aria-label="All questions"></section>
    <div class="footer-space"></div>
  </main>

<script>
const questions = [
  {
    number: 1,
    prompt: `Choose 2 options.
Which two data loss considerations should a Platform Administrator keep in mind when changing a custom field type from Text to Picklist?`,
    options: [
      `There will be no data loss with use of a global value set.`,
      `Auto updates will be made to Visualforce references to prevent data loss.`,
      `Any list view based on the custom field is deleted.`,
      `Assignment and escalation rules may be affected.`
    ],
    correct: [2,3],
    uncertain: false
  },
{
    number: 2,
    prompt: `Choose 1 option.
Cloud Kicks has an administrator team that manages the org. The company has asked for a small subset of leadership users to have Modify All access, like the administrators have.

How should the administrator team accomplish this?`,
    options: [`Assign the standard Platform User profile to the leadership users and edit the permissions to Modify All access..`, `Assign the standard System Administrator profile to the leadership users, which includes Modify All access.`, `Clone the standard User profile for the leadership users and assign a Modify All role to grant access.`, `Assign the standard User profile to the leadership users and add a custom permission set with Modify All access.`],
    correct: [3],
    uncertain: true
  },
{
    number: 3,
    prompt: `choose 2 options.
A Platform Administrator at Ursa Major Solar imported records into an object by mistake.
Which two tools should the administrator use to undo this import?`,
    options: [
      `Mass Delete Records`,
      `Data Import Wizard`,
      `Weekly Data Export`,
      `Data Loader`
    ],
    correct: [0,3],
    uncertain: false
  },
{
    number: 4,
    prompt: `A Platform Administrator at Ursa Major Solar is asked to change the Work Item and Project custom object relationship from a master-detail to a lookup.
Which scenario prevents the administrator from fulfilling the requirement?`,
    options: [
      `A junction object is required to support the lookup.`,
      `The lookup field in all the records contains a value.`,
      `Roll-up summary fields exist on the master object.`,
      `The lookup field is required for saving records.`
    ],
    correct: [2],
    uncertain: false
  },
{
    number: 5,
    prompt: `Choose 1 option.
Which component of an approval process defines the chain of approval, determines which records can advance, and specifies where to assign approval requests?`,
    options: [
      `Approval Steps`,
      `Entry Criteria`,
      `Approval Actions`,
      `Process Definition Detail`
    ],
    correct: [0],
    uncertain: false
  },
{
    number: 6,
    prompt: `Choose 1 option.
When a qualified lead is converted, what happens to its related records?`,
    options: [`Open activities only are attached to the resulting contact, account, and opportunity records.`, `All activities are attached to the resulting contact, account, and opportunity records.`, `Records from custom objects are attached to the resulting contact, account, and opportunity records.`, `Campaign history is attached to the resulting contact, account, and opportunity records.`],
    correct: [3],
    uncertain: false
  },
{
    number: 7,
    prompt: `Choose 1 option.
A Platform Administrator at Cloud Kicks would like to use Salesforce to start tracking details around its marketing efforts. They would like to track details around emails, trade shows, and webinars. Each initiative needs to track different types of information.

How should the administrator accomplish this?`,
    options: [
      `Create record types and page layouts for each type of campaign.`,
      `Create a custom field on the Campaign object for the type of initiative.`,
      `Use campaign hierarchies to organize campaign types.`,
      `Create a custom report type with relevant fields.`
    ],
    correct: [0],
    uncertain: false
  },
{
    number: 8,
    prompt: `Choose 1 option.
A sales manager at Cloud Kicks would like a dashboard to emphasize important data and tell a more compelling data story to the sales reps.

How should a Platform Administrator achieve this?`,
    options: [
      `Use the Highlights Panel.`,
      `Assign a new Task to each rep.`,
      `Use a Text Widget.`,
      `Send out a mass email.`
    ],
    correct: [2],
    uncertain: false
  },
{
    number: 9,
    prompt: `Choose 1 option.
A Platform Administrator at Cloud Kicks has a flow in production that is supposed to create new records. However, no new records are being created.
What is causing this issue?`,
    options: [
      `The flow is inactive.`,
      `The flow URL is deactivated.`,
      `The flow is Read Only.`,
      `The flow trigger is missing.`
    ],
    correct: [0],
    uncertain: false
  },
{
    number: 10,
    prompt: `Choose 1 option.
The client services and customer support teams share the same profile but have different permission sets. The custom object Retention related list needs to be restricted to the client services team on the Lightning record page layout.
What should a Platform Administrator use to fulfill this request?`,
    options: [
      `Record Type Assignment`,
      `Sharing Settings`,
      `Page Layout Assignment`,
      `Component Visibility`
    ],
    correct: [3],
    uncertain: false
  },
{
    number: 11,
    prompt: `Choose 1 option.
The Universal Containers sales team wants a visual way to manage its opportunity pipeline that allows them to see deals at once, track progress through sales stages, and quickly move opportunities forward.

Which feature should a Platform Administrator recommend?`,
    options: [
      `Create a custom dashboard with opportunity pipeline charts and stage metrics.`,
      `Configure opportunity list views with custom filters and summary fields.`,
      `Set up opportunity reports with chart components and stage-based grouping.`,
      `Use the Kanban view for opportunities with card fields and drag-and-drop functionality.`
    ],
    correct: [3],
    uncertain: false
  },
{
    number: 12,
    prompt: `Choose 1 option.
Universal Containers has two sales teams, Sales Team A and Sales Team B. Each team has its own role in the role hierarchy. Both roles are subordinate to the same Manager role.

How should a Platform Administrator share records owned by Sales Team A with Sales Team B?`,
    options: [
      `Criteria-based sharing`,
      `Hierarchical sharing`,
      `Owner-based sharing`,
      `Manual sharing`
    ],
    correct: [2],
    uncertain: false
  },
{
    number: 13,
    prompt: `Choose 1 option.
Which feature gives a sales team the ability to prioritize deals with recent updates in the List View and Kanban View?`,
    options: [
      `Deal Change Highlights`,
      `Big Deal Alerts`,
      `Opportunity Path`,
      `Report Filters`
    ],
    correct: [0],
    uncertain: false
  },
{
    number: 14,
    prompt: `Choose 1 option.
Cloud Kicks has a new Platform Administrator who is asked to put together a memo detailing Salesforce usage to budget for upcoming license purchases.

Where should the administrator go to find out what types of licenses Cloud Kicks has purchased and how many are available?`,
    options: [
      `Usage-based entitlements related list in company information`,
      `User licenses related list in company information`,
      `User management settings in setup`,
      `Search for licenses types in setup`
    ],
    correct: [1],
    uncertain: false
  },
{
    number: 15,
    prompt: `When a sales rep clicks a button on an opportunity, a simple discount calculator screen should be launched.
Which automation tool should a Platform Administrator use to build this discount calculator screen?`,
    options: [
      `Batch Apex`,
      `Flow Builder`,
      `OmniStudio`,
      `Platform Event`
    ],
    correct: [1],
    uncertain: false
  },
{
    number: 16,
    prompt: `Choose 1 option.
In an approval process, which feature allows a user to temporarily assign their approval responsibilities to another user for a predefined time period?`,
    options: [`Queue`, `Delegated Approver`, `Approval Rule`, `Manager`],
    correct: [1],
    uncertain: false
  },
{
    number: 17,
    prompt: `Choose 2 options.
A user at Northern Trail Outfitters is having trouble logging in to Salesforce. The user's login history shows that the user has attempted to log in multiple times and has been locked out of the organization.

Which two steps should a Platform Administrator take?`,
    options: [`Log in as the user to unlock the user and reset the password.`, `Use the Unlock button on the user's record detail page.`, `Reset the password policies to allow the user to log in.`, `Reset the password on the user's record detail page.`],
    correct: [1,3],
    uncertain: false
  },
{
    number: 18,
    prompt: `Choose 1 option.
At Cloud Kicks, cases are being assigned a default Case Owner and showing a Created By and Last Modified By that are not expected. Cloud Kicks wants to change this to an integration user.

What should a Platform Administrator edit?`,
    options: [`Process Automation Settings`, `Support Settings`, `Support Processes`, `Case Assignment Rules`],
    correct: [1],
    uncertain: true
  },
{

  questionsEl.innerHTML = questions.map((q, idx) => {
    const max = inferMaxSelect(q.prompt);
    return `<article class="card" id="q-${q.number}" data-index="${idx}"><div class="card-head"><div class="badges"><span class="badge qn">Question ${q.number}</span><span class="badge type">${typeLabel(max)}</span><span class="badge sel" id="sel-${idx}">Selected: 0 ${max === 1 ? 'option' : 'options'}</span></div></div><div class="question-text">${escapeHtml(q.prompt)}</div>${q.uncertain ? `<div class="note">Scoring uses best-effort answer due to partial source text.</div>` : ``}<div class="options" role="${max===1?'radiogroup':'group'}" aria-label="Options for question ${q.number}">${q.options.map((opt, oIdx) => `<label class="option" data-q="${idx}" data-o="${oIdx}"><input ${max===1?'type="radio"':'type="checkbox"'} name="q-${idx}" /><span class="letter">${letter(oIdx)}</span><span class="option-text">${escapeHtml(opt)}</span><span class="mark" aria-hidden="true"></span></label>`).join('')}</div></article>`;}).join('');
}
function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function setSelection(qIdx, oIdx){
  if(state.submitted) return;
  const q = questions[qIdx];
  const max = inferMaxSelect(q.prompt);
  let arr = [...state.answers[qIdx]];
  if(max === 1){
    arr = arr[0] === oIdx ? [] : [oIdx];
  } else {
    if(arr.includes(oIdx)) arr = arr.filter(x => x !== oIdx);
    else {
      if(arr.length < max) arr.push(oIdx);
      else {
        arr.shift();
        arr.push(oIdx);
      }
    }
  }
  state.answers[qIdx] = arr.sort((a,b)=>a-b);
  updateQuestionUI(qIdx);
  updateStats();
}
function updateQuestionUI(qIdx){
  const card = document.querySelector(`.card[data-index="${qIdx}"]`);
  if(!card) return;
  const max = inferMaxSelect(questions[qIdx].prompt);
  const selected = state.answers[qIdx];
  card.querySelectorAll('.option').forEach(opt => {
    const o = +opt.dataset.o;
    opt.classList.toggle('selected', selected.includes(o));
  });
  const selBadge = document.getElementById(`sel-${qIdx}`);
  selBadge.textContent = `Selected: ${selected.length} ${max === 1 ? 'option' : 'options'}`;
}
function updateStats(){
  const answered = state.answers.filter(a => a.length > 0).length;
  const totalSelections = state.answers.reduce((n,a)=>n+a.length,0);
  answeredStat.textContent = `${answered} / ${questions.length}`;
  selectionStat.textContent = `${totalSelections}`;
  correctStat.textContent = state.submitted ? `${computeResults().correctQuestions}` : '0';
  progressBar.style.width = `${(answered / questions.length) * 100}%`;

  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.toggle('answered', state.answers[i].length > 0);
  });

  if(state.submitted){
    const score = computeResults();
    scoreStat.textContent = `${score.percent}%`;
    modeStat.textContent = state.reviewMode ? 'Review' : 'Submitted';
  } else {
    scoreStat.textContent = '0%';
    modeStat.textContent = 'Attempt';
  }
}
function computeResults(){
  let correctQuestions = 0;
  let answered = 0;
  let totalSelections = 0;
  state.flagged = [];
  questions.forEach((q, i) => {
    const selected = [...state.answers[i]].sort((a,b)=>a-b);
    const correct = [...q.correct].sort((a,b)=>a-b);
    if(selected.length) answered++;
    totalSelections += selected.length;
    const isCorrect = selected.length === correct.length && selected.every((v, idx) => v === correct[idx]);
    if(isCorrect) correctQuestions++;
    else if(selected.length === 0 || !isCorrect) state.flagged.push(i);
  });
  const percent = Math.round((correctQuestions / questions.length) * 100);
  return { answered, totalSelections, correctQuestions, percent };
}
function applyScoringUI(){
  questions.forEach((q, qIdx) => {
    const card = document.querySelector(`.card[data-index="${qIdx}"]`);
    const selected = state.answers[qIdx];
    const correct = q.correct;
    const isCorrectQuestion = selected.length === correct.length && [...selected].sort().every((v,i)=>v===[...correct].sort()[i]);
    card.classList.add('locked');
    card.classList.toggle('correct-card', isCorrectQuestion);
    card.classList.toggle('incorrect-card', !isCorrectQuestion);
    card.querySelectorAll('.option').forEach(opt => {
      const oIdx = +opt.dataset.o;
      opt.classList.remove('correct','incorrect','missed');
      const isSelected = selected.includes(oIdx);
      const isCorrect = correct.includes(oIdx);
      if(isCorrect && isSelected) opt.classList.add('correct');
      else if(!isCorrect && isSelected) opt.classList.add('incorrect');
      else if(isCorrect && !isSelected) opt.classList.add('missed');
    });
  });

  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.remove('flagged','correct','incorrect');
    const q = questions[i];
    const sel = state.answers[i];
    const cor = q.correct;
    const ok = sel.length === cor.length && [...sel].sort().every((v,idx)=>v===[...cor].sort()[idx]);
    if(ok) dot.classList.add('correct');
    else dot.classList.add('incorrect');
    if(sel.length === 0 || !ok) dot.classList.add('flagged');
  });

  const r = computeResults();
  summaryPanel.classList.add('show');
  document.getElementById('sumTotal').textContent = questions.length;
  document.getElementById('sumAnswered').textContent = r.answered;
  document.getElementById('sumSelections').textContent = r.totalSelections;
  document.getElementById('sumCorrectQuestions').textContent = r.correctQuestions;
  document.getElementById('sumScore').textContent = `${r.percent}%`;
  correctStat.textContent = `${r.correctQuestions}`;
  scoreStat.textContent = `${r.percent}%`;
  modeStat.textContent = state.reviewMode ? 'Review' : 'Submitted';
  updateStats();
}
function clearScoringUI(){
  summaryPanel.classList.remove('show');
  document.querySelectorAll('.card').forEach(card => {
    card.classList.remove('locked','correct-card','incorrect-card','flagged-review');
    card.querySelectorAll('.option').forEach(opt => {
      opt.classList.remove('correct','incorrect','missed','selected');
    });
  });
  document.querySelectorAll('.dot').forEach(dot => dot.className = 'dot');
  questions.forEach((_, i) => updateQuestionUI(i));
  updateStats();
}
function submitQuiz(){
  state.submitted = true;
  applyScoringUI();
}
function restartQuiz(){
  state.answers = Array.from({length: questions.length}, () => []);
  state.submitted = false;
  state.reviewMode = false;
  state.reviewIndex = 0;
  clearScoringUI();
}
function reviewNext(){
  if(!state.submitted){
    const firstUnanswered = state.answers.findIndex(a => a.length === 0);
    const target = firstUnanswered >= 0 ? firstUnanswered : 0;
    scrollToQuestion(target);
    flashReview(target);
    return;
  }
  computeResults();
  if(!state.flagged.length) return;
  state.reviewMode = true;
  const idx = state.flagged[state.reviewIndex % state.flagged.length];
  scrollToQuestion(idx);
  flashReview(idx);
  state.reviewIndex++;
}
function scrollToQuestion(idx){
  const el = document.getElementById(`q-${idx+1}`);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
function flashReview(idx){
  document.querySelectorAll('.card').forEach(c => c.classList.remove('flagged-review'));
  const card = document.querySelector(`.card[data-index="${idx}"]`);
  if(card){
    card.classList.add('flagged-review');
    setTimeout(() => card.classList.remove('flagged-review'), 2200);
  }
}

const topbar = document.getElementById('topbar');
const topbarToggle = document.getElementById('topbarToggle');

function toggleTopbar(){
  const collapsed = topbar.classList.toggle('collapsed');
  document.body.classList.toggle('topbar-hidden', collapsed);
  topbarToggle.textContent = collapsed ? 'Show Topbar' : 'Hide Topbar';
  topbarToggle.setAttribute('aria-expanded', String(!collapsed));
}

topbarToggle.addEventListener('click', toggleTopbar);

renderNav();
renderQuestions();
state.submitted = false;
state.reviewMode = false;
updateStats();

questionsEl.addEventListener('change', e => {
  const input = e.target.closest('input');
  if(!input || state.submitted) return;
  const option = input.closest('.option');
  if(!option) return;
  setSelection(+option.dataset.q, +option.dataset.o);
});

submitBtn.addEventListener('click', submitQuiz);
restartBtn.addEventListener('click', restartQuiz);
reviewBtn.addEventListener('click', reviewNext);

const cards = [...document.querySelectorAll('.card')];
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting) entry.target.classList.add('visible');
  });
},{threshold:.08});
cards.forEach((c,i) => {
  c.style.animationDelay = `${Math.min(i*20, 500)}ms`;
  observer.observe(c);
});

const sectionObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    const idx = +entry.target.dataset.index;
    const dot = document.querySelector(`.dot[data-dot="${idx+1}"]`);
    if(dot && entry.isIntersecting){
      document.querySelectorAll('.dot').forEach(d=>d.classList.remove('current'));
      dot.classList.add('current');
    }
  });
},{threshold:.45});
cards.forEach(c=>sectionObserver.observe(c));
</script>
